name: Bildkompression
slug: bildkompression
type: plugin
version: 1.0.0
description: 'Shrinks images right after they are uploaded in Admin 2: phone photos of 10 to 20 MB end up at 1 to 2 MB, EXIF data including the GPS location is removed, orientation is kept.'
icon: compress
author:
  name: Florian Eder
  email: kontakt@florianeder.at
  url: https://florianeder.at
homepage: https://github.com/ederflo/grav-plugin-bildkompression
docs: https://github.com/ederflo/grav-plugin-bildkompression/blob/main/README.md
bugs: https://github.com/ederflo/grav-plugin-bildkompression/issues
keywords: image, upload, compress, resize, exif, gps, admin2
license: MIT

dependencies:
  - { name: grav, version: '>=2.0.0' }
  - { name: api, version: '>=1.0.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: Plugin aktiviert
      highlight: 1
      default: 1
      options: { 1: Ja, 0: Nein }
      validate: { type: bool }
    max_kante:
      type: number
      label: 'Längste Kante (Pixel)'
      help: 'Größere Bilder werden auf diese Kantenlänge verkleinert.'
      default: 2560
      validate: { min: 800, max: 8000 }
    jpeg_qualitaet:
      type: number
      label: 'JPEG-Qualität'
      help: '60–95. Niedriger = kleinere Dateien.'
      default: 82
      validate: { min: 50, max: 95 }
    webp_qualitaet:
      type: number
      label: 'WebP-Qualität'
      default: 80
      validate: { min: 50, max: 95 }
